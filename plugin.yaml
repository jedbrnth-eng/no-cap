name: no-cap
version: "0.3.0"
manifest_version: 2
api_version: 1
description: "Receipts for agent claims. Checks the claims in each final reply (tests pass, merged, pushed, deployed, file written, URL live, SHAs, numbers) against the tool calls of that turn and, for claims about earlier work, earlier turns of the same session (cross_turn, on by default), with no extra model: 🧾 NO CAP, 🧢 CAP or 🤔 NO RECEIPT. /cap makes the agent prove it or retract, /capscore keeps an honesty leaderboard, and the Cap Board dashboard tab ranks agents, models and skills live (this profile by default; a multi-profile team view is opt-in)."
author: "jedbrnth-eng"
license: Apache-2.0
requires_hermes: ">=0.22.5"
tags: [verification, honesty, receipts, tools]
provides_hooks:
  - post_tool_call
  - transform_llm_output
  - pre_verify
  - pre_llm_call
config_schema:
  mode:
    type: str
    default: annotate
    description: "annotate (footer), strict (footer lists 🧢 claims as Unverified and pre_verify nudges coding turns to prove claims, at most 2 nudges), quiet (store only)"
  show_uncertain:
    type: str
    default: "off"
    description: "When to stamp 🤔 NO RECEIPT. off (default): never, only 🧾 and 🧢 are stamped (visible 🤔 had no reliable blind precision yet). strict: only 'tests pass' in a turn that ran no tests, showed no test output and ran no check script. expected: also other claim types that expect a receipt when nothing relevant ran (push, merge, deploy, file...). all: every unsure claim. Unstamped claims are still recorded: /nocap all and /cap see them."
  retention_days:
    type: int
    default: 30
    description: "Days to keep receipt records in plugin-data/no-cap"
  board:
    type: dict
    default: {}
    description: "Cap Board scope. team_profiles: off by default (the board shows only this profile). Set it to 'all' or a list of profile names to opt in to a team view of other profiles' stores; the team view is only shown in the CLI and the dashboard, never in a gateway chat."
  board_sources:
    type: str
    default: ""
    description: "Cap Board team view only: extra receipt stores to rank beside the team profiles. label=path entries separated by ':' or newlines; a path may be a Hermes home, a receipts.jsonl, a folder searched for receipts.jsonl, or a glob. Also read from NOCAP_BOARD_SOURCES."
  board_min_claims:
    type: int
    default: 10
    description: "Cap Board: claims an agent, model or skill needs before its cap rate is shown and ranked (below it the board shows the counts with n, greyed)"
  cross_turn:
    type: bool
    default: true
    description: "Session ledger: a claim about earlier work ('I pushed that earlier', 'tests passed in the last turn') can cite an earlier turn of the same session (footer says 'turn N'). Stored redacted in ledger.jsonl (0600), same retention_days, at most 100 turns / 400 calls per session."
  verify_artifacts:
    type: bool
    default: true
    description: "Fabricated-artifact detector: a claimed commit SHA that isn't an object in the session's repo, or a claimed branch with no local/remote-tracking/tag ref, gets 🧢. Local, read-only, hardened git (no hooks, no fsmonitor, no system/global config, no network) in the session's working directory."
  check_numbers:
    type: bool
    default: true
    description: "Also check counted numbers like '17 files' against tool output"
  self_verify_http:
    type: bool
    default: false
    description: "Let /cap send one HTTP HEAD request (public addresses only, no redirects, 3 s timeout) to re-check a 'URL is live' claim (off = no network)"
  discord_buttons:
    type: str
    default: "off"
    description: "Discord only. off (default): the compact Discord footer, never split across messages. on: a one-line summary in the reply plus a verdict-coloured embed with 🧢 Call cap and 🧾 Show receipts buttons (only the person the reply answered can click; Call cap needs allow_gateway_injection to send the steer, otherwise it answers with the prompt to paste)."
  desktop_chips:
    type: str
    default: auto
    description: "Hermes Desktop receipt chips (clickable 🧾/🧢/🤔 that open the cited command, exit code and output line). auto (default): only while No Cap's desktop half is enabled in Desktop and has checked in through the plugin's own local route, so a disabled half never leaves a raw ::nocap line. on: always on Desktop. off: Desktop gets the text footer. Never emitted on any other surface."
  footer_hint:
    type: str
    default: auto
    description: "auto (default): when an earlier assistant reply in the history ends with a No Cap footer, pre_llm_call adds one fixed, labelled line telling the model the footer is added by the plugin, so it doesn't copy it (Hermes replays the rewritten reply as the model's own words). API-time context only, never stored. off: never."
  coach:
    type: dict
    default: {mode: suggest, min_evidence: 5, auto_after_caps: 0, window_days: 14, min_sample: 10, max_rules: 5}
    description: "Cap Coach. mode: off (no mining, no injection) | suggest (default: /cap coach scan drafts fixes) | auto-suggest-after-N-caps (also a one-line footer when a pattern reaches N caps; N from auto_after_caps, default min_evidence). min_evidence: caps of one pattern before a fix is drafted. window_days: baseline window frozen at approval. min_sample: replies needed on each side before a before/after rate is shown. max_rules: most rules injected per turn. Nothing applies without /cap coach approve <id>; approved coach rules reach the model only through pre_llm_call, labelled, and /cap coach revert <id> stops them."
  obsidian_vault:
    type: str
    default: ""
    description: "Obsidian lessons bridge (opt-in; empty = off, nothing read or written). Absolute path of an existing Obsidian vault. Each 🧢 CAP appends one redacted line to <vault>/<obsidian_folder>/<profile>.md, and the first 🧢 of a pattern adds one Agent Black Box mistake note (see obsidian_board). Writes stay inside the vault: no symlinks, no '..'. docs/OBSIDIAN.md."
  obsidian_folder:
    type: str
    default: "No Cap"
    description: "Vault-relative folder for the per-agent 🧢 notes (no '..', no leading dot, no absolute path)."
  obsidian_board:
    type: str
    default: auto
    description: "Agent Black Box board entries: auto (default: only when the vault has .agentbox.json or an 'Agent Black Box' folder), on, off. One ABB-format mistake note per agent and pattern, created once and never edited."
  obsidian_learn:
    type: bool
    default: false
    description: "Per-agent lessons (needs obsidian_vault too): pre_llm_call adds a labelled line with up to 3 built-in No Cap rules for the patterns this agent was stamped 🧢 on 2+ times, from No Cap's local store. Never reads text from the vault into the prompt."
